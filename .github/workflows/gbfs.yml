name: gbfs-logger

# One run collects for ~5.5 hours (a snapshot every 5 min, aligned to :00/:05/...),
# commits every hour, and at the end starts the next run by itself.
# The cron is only a safety net in case the chain breaks.
# To stop everything: Actions -> gbfs-logger -> "..." -> Disable workflow.

on:
  schedule:
    - cron: "17 */2 * * *"     # backup: every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write              # push data
  actions: write               # start the next run

concurrency:
  group: gbfs-logger
  cancel-in-progress: false    # never kill a run that is collecting

env:
  RUN_MINUTES: 330             # collection time per run (GitHub hard limit is 360)
  CHUNK: 12                    # snapshots per commit (12 x 5 min = 1 hour)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and commit every hour
        run: |
          git config user.name  "gbfs-bot"
          git config user.email "gbfs-bot@users.noreply.github.com"

          commit_push () {
            git add data
            if git diff --cached --quiet; then echo "nothing to commit"; return 0; fi
            git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase -q && git push -q && return 0
              sleep $((RANDOM % 20 + 5))
            done
            echo "::warning::push failed after 5 tries, will retry at next chunk"
          }

          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while [ $(( $(date +%s) + CHUNK * 300 )) -le $end ]; do
            python logger.py --count "$CHUNK" --interval 300 --align || true
            commit_push
          done
          # use whatever time is left with smaller chunks
          left=$(( (end - $(date +%s)) / 300 ))
          if [ "$left" -gt 0 ]; then
            python logger.py --count "$left" --interval 300 --align || true
          fi
          commit_push

      - name: Start next run
        if: ${{ !cancelled() }}      # cancel a run by hand to break the chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gbfs.yml --ref "${{ github.ref_name }}"
