name: gbfs-logger

on:
  schedule:
    - cron: "4-59/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gbfs-logger
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshots
        run: python logger.py --count 3 --interval 300

      - name: Commit and push
        run: |
          git config user.name  "gbfs-bot"
          git config user.email "gbfs-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          echo "push failed after 5 tries"; exit 1
